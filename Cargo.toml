[package]
name = "altkeeper"
version = "0.2.0"
edition = "2021"
description = "AltServer for iOS 17+ that runs on your home server (Docker): renews and installs sideloaded iPhone apps over Wi-Fi, no computer or VPN"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "multipart"] }
idevice = { version = "0.1.68", default-features = false, features = [
  "ring",
  "remote_pairing",
  "rsd",
  "tcp",
  "tunnel_tcp_stack",
  "misagent",
  "installation_proxy",
  "afc",
  "usbmuxd",
] }
isideload = { version = "0.3.17", default-features = false, features = [
  "install",
  "fs-storage",
  "tokio-mt",
] }
mdns-sd = "0.21.4"
plist = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# isideload 0.3.17 dichiara a Apple l'identità "com.apple.dt.Xcode", che Apple
# blocca con un errore 503 al login. La copia in vendor/ è identica all'originale
# tranne la stringa in src/anisette/remote_v3/mod.rs (ora "com.apple.akd/1.0").
[patch.crates-io]
isideload = { path = "vendor/isideload" }

[profile.release]
opt-level = "s"
lto = true
strip = true
