[package]
name = "altkeeper"
version = "0.2.0"
edition = "2021"
description = "AltServer for iOS 17+ that runs on your home server (Docker): renews and installs sideloaded iPhone apps over Wi-Fi, no computer or VPN"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "multipart"] }
idevice = { version = "0.1.68", default-features = false, features = [
  "ring",
  "remote_pairing",
  "rsd",
  "tcp",
  "tunnel_tcp_stack",
  "core_device_proxy",
  "misagent",
  "installation_proxy",
  "afc",
  "usbmuxd",
] }
isideload = { version = "0.4.6", default-features = false, features = [
  "install",
  "fs-storage",
  "tokio-mt",
] }
mdns-sd = "0.21.4"
plist = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# La copia in vendor/ è isideload 0.4.6 (upstream 8ca39b62) con due modifiche locali:
# gli accessor di AnisetteData usati dal ponte AltStore e il logging ALTKEEPER_DEBUG /
# le impostazioni di trasporto HTTP/1.1 portate dalla vecchia copia 0.3.17.
[patch.crates-io]
isideload = { path = "vendor/isideload" }

[profile.release]
opt-level = "s"
lto = true
strip = true
