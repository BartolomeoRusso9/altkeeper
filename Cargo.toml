[package]
default-run = "altkeeper"
name = "altkeeper"
version = "0.5.1"
edition = "2021"
description = "AltServer for iOS 17+ that runs on your home server (Docker): renews and installs sideloaded iPhone apps over Wi-Fi, no computer or VPN"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "multipart", "ws"] }
idevice = { version = "0.1.68", default-features = false, features = [
  "ring",
  "remote_pairing",
  "rsd",
  "tcp",
  "tunnel_tcp_stack",
  "core_device_proxy",
  "misagent",
  "installation_proxy",
  "device_info",
  "debug_proxy",
  "afc",
  "usbmuxd",
] }
isideload = { version = "0.4.6", default-features = false, features = [
  "install",
  "fs-storage",
  "tokio-mt",
] }
mdns-sd = "0.21.4"
plist = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Icona nella barra di sistema (Windows) o nella barra dei menu (macOS), con la finestra della pagina.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
tray-icon = "0.26"
wry = "0.57"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
base64 = "0.21"
hex = "0.4"
omnisette = { git = "https://github.com/SideStore/apple-private-apis.git", rev = "03beb1aa42991ccdad6214dee77e72282bef461f", version = "0.1.0", default-features = false, features = ["async", "remote-anisette"] }
sha2 = "0.10"
uuid = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# La copia in vendor/ è isideload 0.4.6 (upstream 8ca39b62) con due modifiche locali:
# gli accessor di AnisetteData usati dal ponte AltStore e il logging ALTKEEPER_DEBUG /
# le impostazioni di trasporto HTTP/1.1 portate dalla vecchia copia 0.3.17.
[patch.crates-io]
isideload = { path = "vendor/isideload" }

[patch."https://github.com/SideStore/apple-private-apis.git"]
omnisette = { path = "vendor/omnisette" }

[profile.release]
opt-level = "s"
lto = true
strip = true
