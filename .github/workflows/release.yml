# Compila AltKeeper per Windows, Linux e macOS e pubblica tutto in una GitHub Release.
#
# - Windows: `AltKeeper-<tag>-Windows-x64.zip` contiene `AltKeeper.exe`, guide ed esempi;
#   è disponibile anche il binario singolo `AltKeeper-<tag>-Windows-x64.exe`.
# - Linux e macOS CLI: archivi con nome prodotto, versione, sistema e architettura, per esempio
#   `AltKeeper-vX.Y.Z-Linux-x64.tar.gz` o `AltKeeper-vX.Y.Z-macOS-Apple-Silicon-CLI.tar.gz`.
# - macOS GUI: `AltKeeper-vX.Y.Z-macOS-Apple-Silicon-App.zip` (o `macOS-Intel-App`) contiene
#   `AltKeeper.app`; ogni pacchetto ha un file `.sha256` corrispondente.
#
# Parte SOLO a mano: GitHub -> Actions -> release -> "Run workflow" (scegli il branch).
# Il tag della release è `v` + `version` di Cargo.toml e viene creato dalla release stessa.
# Se quel tag esiste già il workflow si ferma: alza la versione in Cargo.toml (e Cargo.lock).
name: release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read the version and check that the tag is free
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "version not found in Cargo.toml"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists: bump version in Cargo.toml"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            package: Windows-x64
            runner: windows-latest
            test: true
          # ubuntu-22.04: glibc 2.35, così il binario gira anche su distribuzioni non recentissime.
          - name: linux-x86_64
            package: Linux-x64
            runner: ubuntu-22.04
            test: true
          - name: linux-aarch64
            package: Linux-ARM64
            runner: ubuntu-22.04-arm
            test: true
          - name: macos-aarch64
            package: macOS-Apple-Silicon-CLI
            app_package: macOS-Apple-Silicon-App
            runner: macos-latest
            test: true
          - name: macos-x86_64
            package: macOS-Intel-CLI
            app_package: macOS-Intel-App
            runner: macos-15-intel
            test: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.test
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          mkdir dist
          cp target/release/altkeeper.exe "dist/AltKeeper-${TAG}-Windows-x64.exe"
          pkg="AltKeeper-${TAG}-Windows-x64"
          mkdir -p "dist/$pkg"
          cp target/release/altkeeper.exe "dist/$pkg/AltKeeper.exe"
          cp LICENSE README.md README.it.md SECURITY.md THIRD-PARTY-NOTICES.md "dist/$pkg/"
          cp -r examples "dist/$pkg/examples"
          mkdir -p "dist/$pkg/docs"
          cp -r docs/en docs/it "dist/$pkg/docs/"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/$pkg/*' -DestinationPath 'dist/$pkg.zip' -Force"
          cd dist
          hash=$(sha256sum "AltKeeper-${TAG}-Windows-x64.exe" | cut -d' ' -f1)
          printf '%s  AltKeeper-%s-Windows-x64.exe' "$hash" "$TAG" \
            > "AltKeeper-${TAG}-Windows-x64.exe.sha256"
          sha256sum "$pkg.zip" > "$pkg.zip.sha256"
      - name: Package (Linux, macOS)
        if: matrix.name != 'windows'
        run: |
          pkg="AltKeeper-${TAG}-${{ matrix.package }}"
          mkdir -p "dist/$pkg"
          cp target/release/altkeeper "dist/$pkg/AltKeeper"
          cp target/release/altkeeper "dist/$pkg/altkeeper"
          cp LICENSE README.md README.it.md \
            SECURITY.md THIRD-PARTY-NOTICES.md "dist/$pkg/"
          cp -r examples "dist/$pkg/examples"
          mkdir -p "dist/$pkg/docs"
          cp -r docs/en docs/it "dist/$pkg/docs/"
          cd dist
          tar -czf "$pkg.tar.gz" "$pkg"
          rm -rf "$pkg"
          if command -v sha256sum >/dev/null; then
            sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          else
            shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          fi
      - name: Package (macOS .app)
        if: startsWith(matrix.name, 'macos')
        run: |
          # Icona nella barra dei menu, Info.plist (LSUIElement, permesso Rete locale) e firma ad-hoc.
          app=$(scripts/macos-app.sh target/release/altkeeper "${TAG#v}" dist)
          # Controllo minimo: l'app deve avviare proprio il binario con l'icona.
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = altkeeper
          codesign --verify --strict "$app"
          zip="AltKeeper-${TAG}-${{ matrix.app_package }}.zip"
          ditto -c -k --keepParent "$app" "dist/$zip"
          rm -rf "$app"
          cd dist
          shasum -a 256 "$zip" > "$zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # Una sola release, creata solo se tutte le build sono riuscite.
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Modified MPL-2.0 source: [`vendor/omnisette/`](https://github.com/${{ github.repository }}/tree/${{ github.sha }}/vendor/omnisette).
          files: dist/*
          fail_on_unmatched_files: true
