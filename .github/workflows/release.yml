# Compila AltKeeper per Windows, Linux e macOS e pubblica tutto in una GitHub Release.
#
# - Windows: `altkeeper.exe` + `altkeeper.exe.sha256`. L'aggiornamento dall'icona nella barra di
#   sistema scarica proprio questi due file: i nomi non vanno cambiati.
# - Linux (x86-64 e arm64) e macOS (Apple Silicon e Intel): `altkeeper-<tag>-<sistema>-<arch>.tar.gz`
#   con il suo `.sha256`. Sono download manuali: l'auto-aggiornamento è solo per Windows.
# - macOS: in più `AltKeeper-<tag>-macos-<arch>.zip` con `AltKeeper.app` (doppio clic: icona nella
#   barra dei menu come AltServer, AltServer e pagina web; vedi scripts/macos-app.sh) e il suo
#   `.sha256`. L'icona avvisa delle nuove versioni e apre la pagina della release.
#
# Parte SOLO a mano: GitHub -> Actions -> release -> "Run workflow" (scegli il branch).
# Il tag della release è `v` + `version` di Cargo.toml e viene creato dalla release stessa.
# Se quel tag esiste già il workflow si ferma: alza la versione in Cargo.toml (e Cargo.lock).
name: release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read the version and check that the tag is free
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "version not found in Cargo.toml"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists: bump version in Cargo.toml"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            runner: windows-latest
            test: true
          # ubuntu-22.04: glibc 2.35, così il binario gira anche su distribuzioni non recentissime.
          - name: linux-x86_64
            runner: ubuntu-22.04
            test: true
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            test: true
          - name: macos-aarch64
            runner: macos-latest
            test: true
          - name: macos-x86_64
            runner: macos-15-intel
            test: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.test
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          mkdir dist
          cp target/release/altkeeper.exe dist/altkeeper.exe
          cd dist
          hash=$(sha256sum altkeeper.exe | cut -d' ' -f1)
          printf '%s  altkeeper.exe' "$hash" > altkeeper.exe.sha256
      - name: Package (Linux, macOS)
        if: matrix.name != 'windows'
        run: |
          pkg="altkeeper-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp target/release/altkeeper LICENSE README.md README.it.md "dist/$pkg/"
          cp -r examples "dist/$pkg/examples"
          cd dist
          tar -czf "$pkg.tar.gz" "$pkg"
          rm -rf "$pkg"
          if command -v sha256sum >/dev/null; then
            sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          else
            shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          fi
      - name: Package (macOS .app)
        if: startsWith(matrix.name, 'macos')
        run: |
          # Icona nella barra dei menu, Info.plist (LSUIElement, permesso Rete locale) e firma ad-hoc.
          app=$(scripts/macos-app.sh target/release/altkeeper "${TAG#v}" dist)
          # Controllo minimo: l'app deve avviare proprio il binario con l'icona.
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = altkeeper
          codesign --verify --strict "$app"
          zip="AltKeeper-${TAG}-${{ matrix.name }}.zip"
          ditto -c -k --keepParent "$app" "dist/$zip"
          rm -rf "$app"
          cd dist
          shasum -a 256 "$zip" > "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # Una sola release, creata solo se tutte le build sono riuscite.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
