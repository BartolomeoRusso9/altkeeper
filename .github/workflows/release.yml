# Compila AltKeeper per Windows, Linux e macOS e pubblica tutto in una GitHub Release.
#
# - Windows: `altkeeper.exe` + `altkeeper.exe.sha256`. L'aggiornamento dall'icona nella barra di
#   sistema scarica proprio questi due file: i nomi non vanno cambiati.
# - Linux (x86-64 e arm64) e macOS (Apple Silicon e Intel): `altkeeper-<tag>-<sistema>-<arch>.tar.gz`
#   con il suo `.sha256`. Sono download manuali: l'auto-aggiornamento è solo per Windows.
#
# Si lancia con un tag, per esempio: git tag v0.3.1 && git push origin v0.3.1
# Il numero del tag deve coincidere con `version` in Cargo.toml.
# Compila AltKeeper per Windows, Linux e macOS e pubblica tutto in una GitHub Release.
#
# - Windows: `altkeeper.exe` + `altkeeper.exe.sha256`. L'aggiornamento dall'icona nella barra di
#   sistema scarica proprio questi due file: i nomi non vanno cambiati.
# - Linux (x86-64 e arm64) e macOS (Apple Silicon e Intel): `altkeeper-<tag>-<sistema>-<arch>.tar.gz`
#   con il suo `.sha256`. Sono download manuali: l'auto-aggiornamento è solo per Windows.
# - macOS: in più `AltKeeper-<tag>-macos-<arch>.zip` con `AltKeeper.app` (doppio clic: avvia il
#   server e apre la pagina web) e il suo `.sha256`.
#
# Parte SOLO a mano: GitHub -> Actions -> release -> "Run workflow" (scegli il branch).
# Il tag della release è `v` + `version` di Cargo.toml e viene creato dalla release stessa.
# Se quel tag esiste già il workflow si ferma: alza la versione in Cargo.toml (e Cargo.lock).
name: release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read the version and check that the tag is free
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "version not found in Cargo.toml"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists: bump version in Cargo.toml"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            runner: windows-latest
            test: true
          # ubuntu-22.04: glibc 2.35, così il binario gira anche su distribuzioni non recentissime.
          - name: linux-x86_64
            runner: ubuntu-22.04
            test: true
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            test: true
          - name: macos-aarch64
            runner: macos-latest
            test: false
          - name: macos-x86_64
            runner: macos-15-intel
            test: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.test
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          mkdir dist
          cp target/release/altkeeper.exe dist/altkeeper.exe
          cd dist
          hash=$(sha256sum altkeeper.exe | cut -d' ' -f1)
          printf '%s  altkeeper.exe' "$hash" > altkeeper.exe.sha256
      - name: Package (Linux, macOS)
        if: matrix.name != 'windows'
        run: |
          pkg="altkeeper-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp target/release/altkeeper LICENSE README.md README.it.md "dist/$pkg/"
          cp -r examples "dist/$pkg/examples"
          cd dist
          tar -czf "$pkg.tar.gz" "$pkg"
          rm -rf "$pkg"
          if command -v sha256sum >/dev/null; then
            sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          else
            shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          fi
      - name: Package (macOS .app)
        if: startsWith(matrix.name, 'macos')
        run: |
          app="dist/AltKeeper.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/altkeeper "$app/Contents/MacOS/altkeeper"
          # Il binario non ha icona nella barra dei menu su macOS: l'app è un avviatore che
          # prepara la cartella dati, apre la pagina web e lascia il server in esecuzione.
          cat > "$app/Contents/MacOS/AltKeeper" <<'LAUNCHER'
          #!/bin/bash
          here="$(cd "$(dirname "$0")" && pwd)"
          data="$HOME/Library/Application Support/AltKeeper"
          mkdir -p "$data"
          ( sleep 3; open "http://127.0.0.1:8787" ) &
          exec "$here/altkeeper" serve --altserver --dir "$data"
          LAUNCHER
          chmod +x "$app/Contents/MacOS/AltKeeper" "$app/Contents/MacOS/altkeeper"
          # Icona .icns dal logo
          iconset="$RUNNER_TEMP/AltKeeper.iconset"
          mkdir -p "$iconset"
          for s in 16 32 64 128 256; do sips -z $s $s assets/logo.png --out "$iconset/tmp_$s.png" >/dev/null; done
          mv "$iconset/tmp_16.png"  "$iconset/icon_16x16.png"
          cp "$iconset/tmp_32.png"  "$iconset/icon_16x16@2x.png"
          mv "$iconset/tmp_32.png"  "$iconset/icon_32x32.png"
          cp "$iconset/tmp_64.png"  "$iconset/icon_32x32@2x.png"
          mv "$iconset/tmp_128.png" "$iconset/icon_128x128.png"
          cp "$iconset/tmp_256.png" "$iconset/icon_128x128@2x.png"
          mv "$iconset/tmp_256.png" "$iconset/icon_256x256.png"
          rm -f "$iconset"/tmp_*.png
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AltKeeper.icns"
          version="${TAG#v}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AltKeeper</string>
            <key>CFBundleDisplayName</key><string>AltKeeper</string>
            <key>CFBundleIdentifier</key><string>io.github.altkeeper</string>
            <key>CFBundleExecutable</key><string>AltKeeper</string>
            <key>CFBundleIconFile</key><string>AltKeeper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Firma ad-hoc (senza account Apple Developer): serve su Apple Silicon, ma Gatekeeper
          # chiederà comunque conferma al primo avvio (vedi README).
          codesign --force --deep -s - "$app"
          zip="AltKeeper-${TAG}-${{ matrix.name }}.zip"
          ditto -c -k --keepParent "$app" "dist/$zip"
          rm -rf "$app"
          cd dist
          shasum -a 256 "$zip" > "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # Una sola release, creata solo se tutte le build sono riuscite.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
