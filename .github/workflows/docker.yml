# Prova il codice e pubblica l'immagine Docker su GitHub Container Registry (ghcr.io).
#
# - Pull request: esegue i test Linux e Windows, senza pubblicare immagini.
# - Push su main: pubblica `latest` e `sha-<commit>` per amd64 e arm64.
# - Tag `vX.Y.Z` (per esempio `git tag v0.2.0 && git push --tags`): pubblica `X.Y.Z`, `X.Y` e
#   `latest`, per amd64 e arm64 (build nativi paralleli, senza QEMU).
#
# L'immagine: ghcr.io/<utente>/altkeeper. Se il repo è privato lo è anche il pacchetto: per
# usarlo da un server serve `docker login ghcr.io` con un token che possa leggere i pacchetti,
# oppure si rende pubblico il pacchetto dalle impostazioni del pacchetto su GitHub.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check localized web UI
        run: node scripts/check-web-ui.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Check English CLI help
        run: |
          ALTKEEPER_LANG=en cargo run --locked -- --help | grep '^usage: altkeeper'
      - name: Check Italian CLI help
        run: |
          ALTKEEPER_LANG=it cargo run --locked -- --help | grep '^uso: altkeeper'

  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check localized web UI
        run: node scripts/check-web-ui.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Check English CLI help
        shell: pwsh
        run: |
          $env:ALTKEEPER_LANG = "en"
          $output = cargo run --locked -- --help
          if ($LASTEXITCODE -ne 0 -or -not ($output -match '^usage: altkeeper')) { throw "English CLI help failed: $output" }
      - name: Check Italian CLI help
        shell: pwsh
        run: |
          $env:ALTKEEPER_LANG = "it"
          $output = cargo run --locked -- --help
          if ($LASTEXITCODE -ne 0 -or -not ($output -match '^uso: altkeeper')) { throw "Italian CLI help failed: $output" }

  image:
    # Build architectures concurrently on native runners; PRs run tests only.
    if: github.event_name != 'pull_request'
    needs: [test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # No QEMU: Rust is compiled natively for each target.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Immutable per-arch pushes; only the final manifest receives tags.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=altkeeper-${{ matrix.arch }}
          cache-to: type=gha,scope=altkeeper-${{ matrix.arch }},mode=max
      - name: Export image digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "${digest}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    # Publish tags only after both architecture builds succeed.
    if: github.event_name != 'pull_request'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Create multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Never publish a partial multi-architecture manifest.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect published manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
